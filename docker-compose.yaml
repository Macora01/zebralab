services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - zebralab
    healthcheck:
      # Chequeo liviano: abrir el puerto cuesta ~0 CPU. Antes se lanzaba `mongosh` (un proceso
      # Node completo) cada 10 s; con el límite de CPU del VPS cada ejecución tardaba 4-6 s y
      # consumía casi todo el presupuesto de CPU, incluso sin uso de la app.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s  # durante el arranque revisa rápido, para no retrasar el backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-zebralab}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zebra.facore.cl}
    volumes:
      - uploads_data:/app/backend/uploads
    networks:
      - zebralab
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://zebra.facore.cl}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - zebralab
    ports:
      - "80"
    labels:
      # Coolify magic env var: tells Traefik this container serves on port 80
      - "coolify.managed=true"
      - "coolify.port=80"

volumes:
  mongo_data:
  uploads_data:

networks:
  zebralab:
    driver: bridge
